<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>noVNC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        #screen {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #status {
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        #password-form {
            background: #2d2d30;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        #password-form input {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            background: #1e1e1e;
            color: white;
            font-size: 14px;
        }
        #password-form button {
            padding: 10px 20px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #password-form button:hover {
            background: #1177bb;
        }
    </style>
</head>
<body>
    <div id="screen">
        <div id="status">Loading VNC viewer...</div>
    </div>
    
    <script type="module">
        import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/core/rfb.js';
        
        const screenEl = document.getElementById('screen');
        const statusEl = document.getElementById('status');
        let rfb = null;
        
        function showPasswordPrompt() {
            statusEl.innerHTML = `
                <div id="password-form">
                    <p>VNC Password Required</p>
                    <input type="password" id="vnc-password" placeholder="Enter VNC password" autofocus>
                    <br>
                    <button onclick="window.submitPassword()">Connect</button>
                </div>
            `;
            document.getElementById('vnc-password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') window.submitPassword();
            });
        }
        
        window.submitPassword = function() {
            const password = document.getElementById('vnc-password').value;
            if (password && rfb) {
                rfb.sendCredentials({ password: password });
                statusEl.textContent = 'Authenticating...';
            }
        };
        
        function connect() {
            try {
                const url = 'ws://127.0.0.1:6080';
                console.log('Connecting to:', url);
                statusEl.textContent = 'Connecting...';
                
                rfb = new RFB(screenEl, url, {
                    wsProtocols: ['binary']
                });
                
                rfb.scaleViewport = true;
                rfb.resizeSession = false;
                rfb.clipViewport = false;
                rfb.qualityLevel = 6;
                rfb.compressionLevel = 2;
                
                rfb.addEventListener('connect', () => {
                    console.log('✅ Connected to VNC server');
                    statusEl.style.display = 'none';
                });
                
                rfb.addEventListener('disconnect', (e) => {
                    console.log('❌ Disconnected:', e.detail);
                    statusEl.style.display = 'block';
                    statusEl.innerHTML = `<p>Disconnected from VNC</p><p style="font-size: 12px;">${e.detail.reason || 'Connection closed'}</p>`;
                });
                
                rfb.addEventListener('securityfailure', (e) => {
                    console.error('🔒 Security failure:', e.detail);
                    statusEl.style.display = 'block';
                    statusEl.innerHTML = '<p style="color: #f48771;">Wrong password</p>';
                    setTimeout(showPasswordPrompt, 1500);
                });
                
                rfb.addEventListener('credentialsrequired', (e) => {
                    console.log('🔑 Credentials required');
                    statusEl.style.display = 'block';
                    showPasswordPrompt();
                });
                
            } catch (error) {
                console.error('❌ Failed:', error);
                statusEl.innerHTML = '<p>Failed to connect</p><p style="font-size: 12px;">' + error.message + '</p>';
            }
        }
        
        setTimeout(connect, 100);
    </script>
</body>
</html>
